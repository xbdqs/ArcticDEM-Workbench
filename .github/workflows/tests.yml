name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Prepare canonical test temporary directory
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          test_temp = Path(os.environ["RUNNER_TEMP"]).resolve() / "arcticdem-tests"
          test_temp.mkdir(parents=True, exist_ok=True)
          test_temp = test_temp.resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as stream:
              for name in ("TMPDIR", "TEMP", "TMP"):
                  stream.write(f"{name}={test_temp}\n")
          print(f"Canonical test temporary directory: {test_temp}")
      - name: Install binary stack
        run: "python -m pip install --only-binary=:all: -r requirements-dev.txt"
      - name: Verify source and offline behaviour
        run: python -I -X utf8 tools/verify_public_release.py --output work/ci-verification
      - name: Build wheel and source distribution
        run: python -m build --outdir work/dist
      - name: Install the wheel
        run: python -m pip install --no-deps --force-reinstall work/dist/arcticdem_workbench-0.11.1-py3-none-any.whl
      - name: Test installed wheel outside source import path
        run: python -I tools/wheel_smoke.py
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}
          path: |
            work/ci-verification/
            work/UPLOAD_PUBLIC_ACCEPTANCE_*.zip
            work/dist/
