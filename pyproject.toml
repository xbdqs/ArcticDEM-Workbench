[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcticdem-workbench"
version = "0.11.1"
description = "Desktop ArcticDEM queries, elevation differences and multi-epoch registration network diagnostics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.13,<1.16", "rasterio>=1.4,<1.5", "affine>=2.4,<3", "pyproj>=3.7,<3.8", "shapely>=2.1,<2.2", "matplotlib>=3.10,<3.11", "PySide6-Essentials>=6.9,<6.10"]

[project.scripts]
arcticdem-workbench = "arcticdem_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["arcticdem_workbench*"]

[tool.setuptools.package-data]
arcticdem_workbench = ["assets/*.geojson", "assets/*.json", "assets/pilots/*.json", "assets/pilots/*.csv"]
